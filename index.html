<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvkezelő</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="text" placeholder="Cím" id="cim">
    <input type="text" placeholder="Szerző" id="szerzo">
    <input type="text" placeholder="Kiadási év" id="kiadasiEv">
    <input type="text" placeholder="Oldalszám" id="oldalszam"> 
    <select id="kategoriaValaszto">
        <option value="Történelmi">Történelmi</option>
        <option value="Regény">Regény</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Sci-fi">Sci-fi</option>
    </select>

    <button id="hozzaad" onclick="konyvHozzaadasa()">
        Könyv hozzáadása
    </button>

    <select id="legordulo" onchange="megjelenitesLegordulo()">
        <option value="">Minden kategória</option>
        <option value="Történelmi">Történelmi</option>
        <option value="Regény">Regény</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Sci-fi">Sci-fi</option>
    </select>

<div class="statisztikak">

        <div class="statisztika">
            <button id="legregebbiBtn" onclick="legRegebbiKonyv()">
                Legrégebbi könyv
            </button>
            <p id="legregebbi"></p>
        </div>

        <div class="statisztika">
            <button id="legvastagabbKonyv" onclick="legVastagabb()">
                Legvastagabb könyv
            </button>
            <p id="legvastagabb"></p>
        </div>

</div>

    <p id="atlagOldalSzam"></p>

    <button id="osszesKonyv" onclick="osszesKonyvMegjelenitese()">
        Összes könyv
    </button>

<label>Adatok</label>

    <table id="tablazat">
        <thead>
            <tr></tr>
        </thead>
        <tbody></tbody>
    </table>

    <table id="szabadTablazat">
        <thead></thead>
        <tbody></tbody>
    </table>


    


    <script src="app.js"></script>
</body>
</html>
