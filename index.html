<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvkezelő</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="text" placeholder="Cím" id="cim">
    <input type="text" placeholder="Szerző" id="szerzo">
    <input type="text" placeholder="Kiadási év" id="kiadasiEv">
    <input type="text" placeholder="Oldalszám" id="oldalszam"> 
    <button id="hozzaad" onclick="konyvHozzaadasa()">Könyv hozzáadása</button>
    <select id="legordulo" onchange="megjelenitesLegordulo()">
        <option value="">Minden kategória</option>
        <option value="Történelmi">Történelmi</option>
        <option value="Regény">Regény</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Sci-fi">Sci-fi</option>
    </select>
    <label>Adatok</label>

    <table id="tablazat">
        <thead>
            <tr></tr>
        </thead>
        <tbody></tbody>
    </table>
    <h2>Elérhető könyvek</h2>
    <table id="szabadTablazat">
        <thead></thead>
        <tbody></tbody>
    </table>
    <p id="legregebbi"></p>
    <p id="legvastagabb"></p>
    <p id="atlagOldalSzam"></p>
    <h3>Szűrés kategória szerint</h3>
    <button onclick="megjelenitKategoriaSzerint('Történelmi')">Történelmi</button>
    <button onclick="megjelenitKategoriaSzerint('Regény')">Regény</button>
    <button onclick="megjelenitKategoriaSzerint('Fantasy')">Fantasy</button>
    <button onclick="megjelenitKategoriaSzerint('Sci-fi')">Sci-fi</button>
    <p id="kategoria"></p>
    


    <script src="app.js"></script>
</body>
</html>
